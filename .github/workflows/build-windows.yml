name: Build Windows installer

# Produces the one-click Windows installer (.msi and .exe/NSIS) for the
# Godown Stock Register desktop app, signed for auto-updates.
#
# - Push a tag like "v1.0.0" to build the installer AND publish it as a
#   GitHub Release (this is the normal way to cut a new version — the app's
#   built-in auto-updater checks this repo's *latest* release).
# - Or run this workflow manually ("Run workflow" button) to just build
#   the installer and attach it to the run as a downloadable artifact,
#   without creating or updating a release.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY          - the updater signing private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - its password
#   GOOGLE_OAUTH_CLIENT_ID             - optional, enables Google Drive backup
#   GOOGLE_OAUTH_CLIENT_SECRET         - optional, enables Google Drive backup

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Godown Stock Register ${{ github.ref_name }}"
          releaseBody: |
            Godown stock register — items, categories, and dated OUT/IN movements.
            Local-first: everything lives in one SQLite file on this PC. Google Drive
            backup is optional and only runs when you click it.

            ## Installing
            Download `Godown.Stock.Register_*_x64-setup.exe` (or the `.msi`) below, run it, and launch
            "Godown Stock Register" from the Start menu.

            ## Updating
            The app checks for new versions on launch and offers a one-click install — you
            won't normally need to download this manually after your first install.

            ## Backing up your data
            Use **Backup** in the app's sidebar any time to save a copy of your register to
            a file of your choice (or to Google Drive, if connected), and **Restore** to load
            one back in.
          releaseDraft: false
          prerelease: false

      - name: Build only (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: godown-stock-register-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
