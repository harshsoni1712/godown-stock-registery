name: Build Windows installer

# Produces the one-click Windows installer (.msi and .exe/NSIS) for the
# Godown Stock Register desktop app, signed for auto-updates.
#
# - A push to main that bumps the version in package.json builds the
#   installer AND publishes it as a GitHub Release, tagged vX.Y.Z, in the
#   same run — this is the normal way to cut a new version. Merging a
#   version-bump PR is the only step needed; nothing to click afterwards.
#   (Pushing to main without a version bump is a no-op: the check-version
#   job sees the tag already exists and skips the build.)
# - Or run this workflow manually ("Run workflow" button) to just build
#   the installer and attach it to the run as a downloadable artifact,
#   without creating or updating a release.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY          - the updater signing private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - its password
#   GOOGLE_OAUTH_CLIENT_ID             - optional, enables Google Drive backup
#   GOOGLE_OAUTH_CLIENT_SECRET         - optional, enables Google Drive backup

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    outputs:
      mode: ${{ steps.v.outputs.mode }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to release
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=build_only" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing new to release."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          else
            echo "mode=release" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.mode != 'skip'
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release (version bump on main)
        if: needs.check-version.outputs.mode == 'release'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.check-version.outputs.tag }}
          releaseName: "Godown Stock Register ${{ needs.check-version.outputs.tag }}"
          releaseBody: |
            Godown stock register — items, categories, and dated OUT/IN movements.
            Local-first: everything lives in one SQLite file on this PC. Google Drive
            backup is optional and only runs when you click it.

            ## Installing
            Download `Godown.Stock.Register_*_x64-setup.exe` (or the `.msi`) below, run it, and launch
            "Godown Stock Register" from the Start menu.

            ## Updating
            The app checks for new versions on launch and offers a one-click install — you
            won't normally need to download this manually after your first install.

            ## Backing up your data
            Use **Backup** in the app's sidebar any time to save a copy of your register to
            a file of your choice (or to Google Drive, if connected), and **Restore** to load
            one back in.
          releaseDraft: false
          prerelease: false

      - name: Build only (manual run)
        if: needs.check-version.outputs.mode == 'build_only'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact (manual run)
        if: needs.check-version.outputs.mode == 'build_only'
        uses: actions/upload-artifact@v4
        with:
          name: godown-stock-register-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
