name: Build Windows installer

# Produces the one-click Windows installer (.msi and .exe/NSIS) for the
# Godown Stock Register desktop app.
#
# - Push a tag like "v1.0.0" to build the installer AND publish it as a
#   GitHub Release (this is the normal way to cut a new version).
# - Or run this workflow manually ("Run workflow" button) to just build
#   the installer and attach it to the run as a downloadable artifact,
#   without creating a release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Godown Stock Register ${{ github.ref_name }}"
          releaseBody: |
            Offline godown stock register — items, categories, and dated OUT/IN movements.
            No internet, no login, no cloud. Everything is stored locally in a single SQLite file.

            ## Installing
            Download `Godown.Stock.Register_*_x64-setup.exe` (or the `.msi`) below, run it, and launch
            "Godown Stock Register" from the Start menu.

            ## Backing up your data
            Use the **Backup** button in the app's sidebar any time to save a copy of your register to
            a file of your choice, and **Restore** to load one back in.
          releaseDraft: true
          prerelease: false

      - name: Build only (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: godown-stock-register-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
